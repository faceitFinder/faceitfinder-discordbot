name: Unit tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Called by dockerhub-publish.yml: no image is published nor deployed if the tests fail
  workflow_call:

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Same major version as the Docker image (node:24.14.0)
          node-version: 24
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run unit tests
        run: yarn test
